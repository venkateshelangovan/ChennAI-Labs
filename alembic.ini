# A generic, single database configuration.

[alembic]
# path to migration scripts. Deliberately a plain path relative to the
# current working directory (NOT the newer %(here)s interpolation,
# which requires Alembic >= 1.13 and has been the source of confusing
# "can't find Python file" errors on setups with an older/shadowed
# alembic install). Run `alembic` commands from inside `chennai_labs/`
# — that's where README.md tells you to run them from.
script_location = alembic

prepend_sys_path = .

path_separator = os

# database URL. This is consumed by the user-maintained env.py script only.
# The real value comes from app/core/config.py Settings.database_url
# (i.e. your .env's DATABASE_URL) at runtime — see alembic/env.py.
# This placeholder is never actually connected to.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. Not used in this project.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
