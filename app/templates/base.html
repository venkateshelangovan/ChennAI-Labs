<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ChennAI Labs{% endblock %}</title>
  <!-- Stage 13: main.css has defined --font-ui/--font-narrative since
       Stage 1, but nothing ever actually loaded Inter or Source Serif 4
       — every page has silently been rendering system-font fallbacks
       this whole time. Fixed here rather than left for Stage 18, since
       Stage 13's one narrative-font decision (see .narration-text in
       main.css) would otherwise render with no visible effect at all. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz@0,8..60;1,8..60&display=swap"
  />
  <link rel="stylesheet" href="/static/css/main.css" />
  <script src="/static/js/tracker.js" defer></script>
</head>
<body {% block body_attrs %}{% endblock %}>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="brand">ChennAI Labs</a>
      <nav class="site-nav">
        <a href="/courses">Courses</a>
        {% if current_user %}
          {% if current_user.role == "admin" %}
          <a href="/admin/products">Admin</a>
          <a href="/admin/events">Events</a>
          <a href="/admin/recommendations">Recommendations</a>
          {% endif %}
          <a href="/profile">My Interests</a>
          <a href="/dashboard">Dashboard</a>
          <form method="post" action="/logout" class="nav-logout-form">
            <button type="submit" class="link-button">Log out</button>
          </form>
        {% else %}
          <a href="/login">Log in</a>
          <a href="/register" class="nav-cta">Sign up</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
